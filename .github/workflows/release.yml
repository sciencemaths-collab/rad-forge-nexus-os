name: Signed RAD Agent release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: npm ci --prefix sdk/typescript --ignore-scripts
      - name: Verify tag matches package version
        run: |
          expected="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "${expected}"
      - name: Install acceptance browsers
        run: uv run playwright install --with-deps chromium firefox
      - name: Run release qualification
        run: uv run python scripts/release_evidence.py --output artifacts/release-evidence
      - name: Build deterministic distributions and evidence archive
        env:
          SOURCE_DATE_EPOCH: ${{ github.event.repository.pushed_at }}
        run: |
          uv build --offline
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -czf dist/release-evidence.tar.gz artifacts/release-evidence
          sha256sum dist/* | sort -k2 > dist/SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push pinned RAD Agent image
        id: image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/rad-agent
          IMAGE: ghcr.io/${{ github.repository_owner }}/rad-agent:${{ github.ref_name }}
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --provenance=mode=max --sbom=true --tag "${IMAGE}" --push .
          digest="$(docker buildx imagetools inspect "${IMAGE}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "subject=${IMAGE_REPOSITORY}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.image.outputs.subject }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
