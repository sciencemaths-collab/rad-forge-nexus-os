name: CI and release evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      - name: Install acceptance browsers
        run: uv run playwright install --with-deps chromium firefox
      - run: npm ci --prefix sdk/typescript --ignore-scripts
      - name: Run gates and generate evidence
        run: uv run python scripts/release_evidence.py --output artifacts/release-evidence
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-acceptance-failures
          path: |
            artifacts/browser-acceptance
            artifacts/qualified-browser
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-evidence
          path: artifacts/release-evidence
          if-no-files-found: error
          retention-days: 14
