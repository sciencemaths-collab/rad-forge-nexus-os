openapi: 3.1.1
info:
  title: RAD Forge / NEXUS OS Control API
  version: 1.0.0
  description: Provider-neutral control plane. Acceptance of a request is not proof of task completion.
servers:
  - url: http://127.0.0.1:8765
security:
  - bearerAuth: []
paths:
  /v1/projects:
    post:
      operationId: createProject
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/project.schema.json'}
      responses:
        '201': {$ref: '#/components/responses/ProjectResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
  /v1/projects/{projectId}:
    get:
      operationId: getProject
      parameters: [$ref: '#/components/parameters/ProjectId']
      responses:
        '200': {$ref: '#/components/responses/ProjectResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /v1/projects/{projectId}/plan:
    post:
      operationId: planProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': {$ref: '#/components/responses/RunResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /v1/runs:
    post:
      operationId: createRun
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [project_id]
              properties: {project_id: {type: string}}
      responses:
        '202': {$ref: '#/components/responses/RunResponse'}
  /v1/runs/{runId}:
    get:
      operationId: getRun
      parameters: [$ref: '#/components/parameters/RunId']
      responses:
        '200': {$ref: '#/components/responses/RunResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /v1/runs/{runId}/cancel:
    post:
      operationId: cancelRun
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: {'202': {$ref: '#/components/responses/RunResponse'}}
  /v1/runs/{runId}/resume:
    post:
      operationId: resumeRun
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: {'202': {$ref: '#/components/responses/RunResponse'}}
  /v1/runs/{runId}/evidence:
    get:
      operationId: listEvidence
      parameters: [$ref: '#/components/parameters/RunId']
      responses:
        '200':
          description: Evidence records
          content:
            application/json:
              schema: {type: array, items: {$ref: '../schemas/evidence.schema.json'}}
  /v1/approvals/{approvalId}:
    get:
      operationId: getApproval
      parameters: [$ref: '#/components/parameters/ApprovalId']
      responses:
        '200':
          description: Approval
          content: {application/json: {schema: {$ref: '../schemas/approval.schema.json'}}}
  /v1/approvals/{approvalId}/decision:
    post:
      operationId: decideApproval
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: {enum: [APPROVED, DENIED]}
                reason: {type: string, maxLength: 2000}
      responses:
        '200':
          description: Decided approval
          content: {application/json: {schema: {$ref: '../schemas/approval.schema.json'}}}
  /v1/providers:
    get:
      operationId: listProviders
      responses:
        '200':
          description: Providers
          content: {application/json: {schema: {type: array, items: {$ref: '../schemas/provider.schema.json'}}}}
  /v1/capabilities:
    get:
      operationId: listCapabilities
      responses:
        '200':
          description: Capabilities
          content: {application/json: {schema: {type: array, items: {$ref: '../schemas/capability.schema.json'}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    ProjectId: {name: projectId, in: path, required: true, schema: {type: string}}
    RunId: {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
    ApprovalId: {name: approvalId, in: path, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
        retryable: {type: boolean}
        details: {type: object}
    Run:
      type: object
      additionalProperties: false
      required: [run_id, project_id, state]
      properties:
        run_id: {type: string, format: uuid}
        project_id: {type: string}
        state: {enum: [SPECIFYING, PLANNED, RUNNING, WAITING_APPROVAL, VERIFYING, REPAIRING, QUALIFYING, COMPLETED, FAILED, CANCELLED]}
  responses:
    ProjectResponse:
      description: Project
      content: {application/json: {schema: {$ref: '../schemas/project.schema.json'}}}
    RunResponse:
      description: Run
      content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}
    ErrorResponse:
      description: Error
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}

