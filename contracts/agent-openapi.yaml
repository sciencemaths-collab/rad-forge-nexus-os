openapi: 3.1.1
info:
  title: NEXUS Agent API Contract
  version: 0.4.0
  description: Transport-neutral authenticated Agent and governed runtime application boundary; no network server or live tool is claimed.
security:
  - bearerAuth: []
paths:
  /v1/agent/sessions:
    post:
      operationId: createAgentSession
      x-required-scope: agent:write
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [project_id, objective]
              properties:
                project_id: {type: string, pattern: '^[a-z][a-z0-9_-]{1,63}$'}
                objective: {type: string, minLength: 1, maxLength: 8000}
      responses:
        '201': {$ref: '#/components/responses/AgentSessionResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
  /v1/agent/sessions/{sessionId}:
    get:
      operationId: getAgentSession
      x-required-scope: agent:read
      parameters: [$ref: '#/components/parameters/SessionId']
      responses:
        '200': {$ref: '#/components/responses/AgentSessionResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /v1/agent/sessions/{sessionId}/clarifications:
    post:
      operationId: submitAgentClarification
      x-required-scope: agent:write
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [response]
              properties: {response: {type: string, minLength: 1, maxLength: 8000}}
      responses:
        '200': {$ref: '#/components/responses/AgentSessionResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /v1/agent/sessions/{sessionId}/candidate:
    get:
      operationId: getAgentCandidateSpecification
      x-required-scope: agent:read
      parameters: [$ref: '#/components/parameters/SessionId']
      responses:
        '200':
          description: Candidate specification
          content: {application/json: {schema: {$ref: '../schemas/agent-candidate-specification.schema.json'}}}
  /v1/agent/sessions/{sessionId}/candidate/revisions:
    post:
      operationId: reviseAgentCandidateSpecification
      x-required-scope: agent:write
      description: Generate a new immutable candidate revision from operator instructions; never mutates or approves the prior revision.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [instructions]
              properties: {instructions: {type: string, minLength: 1, maxLength: 8000}}
      responses:
        '200':
          description: New immutable candidate revision
          content: {application/json: {schema: {$ref: '../schemas/agent-candidate-specification.schema.json'}}}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /v1/agent/sessions/{sessionId}/approve:
    post:
      operationId: approveAgentCandidateSpecification
      x-required-scope: agent:approve
      x-human-principal-required: true
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidate_digest]
              properties: {candidate_digest: {type: string, pattern: '^[a-f0-9]{64}$'}}
      responses:
        '200': {$ref: '#/components/responses/AgentSessionResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
  /v1/agent/sessions/{sessionId}/runtime:
    post:
      operationId: startAgentRuntime
      x-required-scope: agent:execute
      parameters: [$ref: '#/components/parameters/SessionId', $ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [workspace_root], properties: {workspace_root: {type: string, minLength: 1, maxLength: 4096}}}}}
      responses:
        '201': {$ref: '#/components/responses/RuntimeResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
    get:
      operationId: getAgentRuntime
      x-required-scope: agent:read
      parameters: [$ref: '#/components/parameters/SessionId']
      responses: {'200': {$ref: '#/components/responses/RuntimeResponse'}}
  /v1/agent/sessions/{sessionId}/runtime/pause:
    post:
      operationId: pauseAgentRuntime
      x-required-scope: agent:execute
      description: Durably pause a running runtime between governed task dispatches.
      parameters: [$ref: '#/components/parameters/SessionId', $ref: '#/components/parameters/IdempotencyKey']
      responses: {'200': {$ref: '#/components/responses/RuntimeResponse'}, '409': {$ref: '#/components/responses/ErrorResponse'}}
  /v1/agent/sessions/{sessionId}/runtime/resume:
    post:
      operationId: resumeAgentRuntimeExecution
      x-required-scope: agent:execute
      description: Durably resume execution from a PAUSED runtime checkpoint.
      parameters: [$ref: '#/components/parameters/SessionId', $ref: '#/components/parameters/IdempotencyKey']
      responses: {'200': {$ref: '#/components/responses/RuntimeResponse'}, '409': {$ref: '#/components/responses/ErrorResponse'}}
  /v1/agent/sessions/{sessionId}/runtime/cancel:
    post:
      operationId: cancelAgentRuntime
      x-required-scope: agent:execute
      x-human-principal-required: true
      description: Durably cancel all non-terminal runtime tasks and the bound Agent session.
      parameters: [$ref: '#/components/parameters/SessionId', $ref: '#/components/parameters/IdempotencyKey']
      responses: {'200': {description: Cancelled runtime and Agent session}, '409': {$ref: '#/components/responses/ErrorResponse'}}
  /v1/agent/sessions/{sessionId}/runtime/ticks:
    post:
      operationId: tickAgentRuntime
      x-required-scope: agent:execute
      parameters: [$ref: '#/components/parameters/SessionId', $ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        content: {application/json: {schema: {type: object, additionalProperties: false, properties: {approval_id: {type: string, format: uuid}, task_id: {type: string}}}}}
      responses: {'200': {description: Governed scheduler tick}}
  /v1/agent/sessions/{sessionId}/runtime/preparations:
    post:
      operationId: prepareAgentRuntimeTask
      x-required-scope: agent:execute
      description: Prepare or recover the qualified artifact bound to one exact ready task.
      parameters: [$ref: '#/components/parameters/SessionId', $ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        content: {application/json: {schema: {type: object, additionalProperties: false, properties: {task_id: {type: string}}}}}
      responses: {'200': {description: Exact proposed artifact, digest, task binding, and PROPOSED status}}
    get:
      operationId: listAgentRuntimePreparations
      x-required-scope: agent:read
      description: Graph-wide durable preparation and runtime status in topological order.
      parameters: [$ref: '#/components/parameters/SessionId']
      responses: {'200': {description: Preparation status and artifact digest for every runtime task}}
  /v1/agent/sessions/{sessionId}/runtime/preview:
    get:
      operationId: previewAgentRuntimeAction
      x-required-scope: agent:read
      description: Side-effect-free preview of the exact next typed-tool action and policy decision.
      parameters: [$ref: '#/components/parameters/SessionId']
      responses: {'200': {description: Exact next governed action preview}}
  /v1/agent/sessions/{sessionId}/runtime/evidence:
    get:
      operationId: listAgentRuntimeEvidence
      x-required-scope: agent:read
      description: Ordered append-only evidence records for the exact Agent run.
      parameters: [$ref: '#/components/parameters/SessionId']
      responses:
        '200':
          description: Runtime evidence chain with EMPTY or cryptographically VERIFIED status and head hash
  /v1/agent/sessions/{sessionId}/runtime/artifacts:
    get:
      operationId: listAgentRuntimeArtifacts
      x-required-scope: agent:read
      description: List successful graph-declared workspace artifacts after boundary and provenance validation.
      parameters: [$ref: '#/components/parameters/SessionId']
      responses: {'200': {description: Downloadable artifact metadata and digests}}
  /v1/agent/sessions/{sessionId}/runtime/artifacts/{taskId}:
    get:
      operationId: downloadAgentRuntimeArtifact
      x-required-scope: agent:read
      description: Return one bounded verified JSON artifact as base64 content; arbitrary workspace paths are never accepted.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: taskId
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z][a-z0-9_-]{1,63}$'}
      responses: {'200': {description: Verified artifact metadata and base64 content}, '409': {$ref: '#/components/responses/ErrorResponse'}}
  /v1/agent/sessions/{sessionId}/runtime/approvals/{approvalId}:
    post:
      operationId: decideAgentRuntimeApproval
      x-required-scope: agent:approve
      x-human-principal-required: true
      parameters: [$ref: '#/components/parameters/SessionId', $ref: '#/components/parameters/ApprovalId', $ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [status], properties: {status: {enum: [APPROVED, DENIED]}, reason: {type: string, maxLength: 2000}}}}}
      responses: {'200': {description: Approval decision}}
  /v1/agent/sessions/{sessionId}/runtime/verify:
    post:
      operationId: verifyAgentRuntimeCompletion
      x-required-scope: agent:verify
      parameters: [$ref: '#/components/parameters/SessionId', $ref: '#/components/parameters/IdempotencyKey']
      responses: {'200': {description: Verified Agent completion result}}
  /v1/model-qualifications:
    get:
      operationId: listModelQualifications
      x-required-scope: model-qualifications:read
      responses:
        '200':
          description: Reasoning model qualifications
          content:
            application/json:
              schema: {type: array, items: {$ref: '../schemas/model-qualification.schema.json'}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    SessionId: {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
    ApprovalId: {name: approvalId, in: path, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
        retryable: {type: boolean}
  responses:
    AgentSessionResponse:
      description: Agent session
      content: {application/json: {schema: {$ref: '../schemas/agent-session.schema.json'}}}
    ErrorResponse:
      description: Error
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    RuntimeResponse:
      description: Durable runtime snapshot
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [run_id, graph_digest, run_state, task_states, revision]
            properties:
              run_id: {type: string, format: uuid}
              graph_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
              run_state: {enum: [READY, RUNNING, PAUSED, SUCCEEDED, FAILED, CANCELLED]}
              task_states: {type: object, additionalProperties: {type: string}}
              revision: {type: integer, minimum: 1}
