schema_version: "1.0"
project_id: app_build_demo
name: Verified Application Build
mode: app_build
goal: Build an application through specification, implementation, and verified evidence gates.
workspace:
  root: ./workspace
  read_only: false
  network_allowlist: []
providers:
  planner:
    adapter: mock
    model: deterministic-fixture-v1
secrets: {}
policy:
  max_attempts: 3
  max_elapsed_seconds: 7200
  max_cost_usd: 0
  require_approval: [SENSITIVE, DESTRUCTIVE]
acceptance:
  - id: APP_BUILD_TESTED
    description: Contract, unit, integration, security, and failure tests pass.
    verifier: nexus.verify.test_report
  - id: APP_BUILD_EVIDENCE
    description: The final build evidence report verifies every required gate.
    verifier: nexus.evidence.verify
