schema_version: "1.0"
project_id: rw_100k_demo
name: 100k Row Reference Workflow
mode: data_analysis
goal: Deterministically analyze and persist a 100,000-row CSV with verified evidence.
workspace:
  root: ./workspace
  read_only: false
  network_allowlist: []
providers:
  planner:
    adapter: mock
    model: deterministic-fixture-v1
  explainer:
    adapter: mock
    model: deterministic-fixture-v1
secrets: {}
policy:
  max_attempts: 3
  max_elapsed_seconds: 3600
  max_cost_usd: 0
  require_approval: [SENSITIVE, DESTRUCTIVE]
acceptance:
  - id: RW_100K_ROWS
    description: The imported file contains exactly 100,000 data rows.
    verifier: nexus.verify.row_count
  - id: RW_EVIDENCE
    description: The complete evidence hash chain verifies.
    verifier: nexus.evidence.verify

